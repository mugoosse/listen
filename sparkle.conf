# The Sparkle update-signing identity. Sourced by make_app.sh and release.sh.
#
# One definition, two readers: make_app.sh bakes the public key into
# Info.plist as SUPublicEDKey, and release.sh signs the appcast with the
# matching private half. If those ever disagree, every installed copy rejects
# every update, and the only symptom is an update that never arrives. Keeping
# them in one file is what makes disagreeing impossible.
#
# Both values are overridable from the environment, which is how CI and a fork
# build with a different key.

# NOT the default `ed25519` account. That one holds Speak's key, and the two
# apps deliberately do not share an update-signing key: one leaked key would
# otherwise be an arbitrary-code-execution channel into both apps. Every tool
# that reads the private key has to be told this, because the default is
# silent and produces an appcast signed by the wrong key.
SPARKLE_ACCOUNT="${SPARKLE_ACCOUNT:-listen}"

# Public by design. The private half lives in the login keychain under the
# account above and never leaves it. Losing it ends the update channel for
# every installed copy: see RELEASING.md.
#
# Assigned with `-` rather than `:-`, so an explicitly empty
# SPARKLE_PUBLIC_KEY stays empty and make_app.sh omits the update keys
# altogether. That is the escape hatch for a fork, which must not ship a
# build that accepts updates signed by Listen's key.
SPARKLE_PUBLIC_KEY="${SPARKLE_PUBLIC_KEY-5EKeaFtG+Xpljo99wxZPDse5srhayWUROzg4JCphn8Q=}"
