<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The site moved to listenbrain.app. This page is all that is left here, and
     it exists because the shipped app links to this URL: `Links.swift` sends
     Help, Listen Website here in every build up to 0.44.0, and those copies
     cannot be edited. Deleting Pages would 404 a menu item for everybody who
     already installed it.

     A meta refresh rather than a 301, because GitHub Pages serves static files
     and cannot send a status code. The canonical tag is what tells a search
     engine which of the two is the real one. -->
<title>Listen has moved to listenbrain.app</title>
<link rel="canonical" href="https://listenbrain.app/">
<meta name="robots" content="noindex">
<script>
// Carry the path over rather than dropping every saved deep link on the
// homepage: /listen/security.html becomes listenbrain.app/security, which is
// the extensionless form the Worker serves.
var p = location.pathname.replace(/^\/listen\/?/, "").replace(/\.html$/, "");
location.replace("https://listenbrain.app/" + p + location.hash);
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://listenbrain.app/"></noscript>
<style>
  body { background:#faf9f6; color:#56534b; margin:0; min-height:100vh;
         display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; }
  main { max-width:30rem; padding:2rem; }
  h1 { font-family:ui-serif,"New York",Georgia,serif; font-weight:400;
       font-size:2rem; color:#23221f; margin:0 0 .75rem; letter-spacing:-.02em; }
  a { color:#3f52d9; }
</style>
</head>
<body>
<main>
  <h1>Listen has moved.</h1>
  <p>The site is now at <a href="https://listenbrain.app/">listenbrain.app</a>.
  You should be sent there automatically.</p>
</main>
</body>
</html>
